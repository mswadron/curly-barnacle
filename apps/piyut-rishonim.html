<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>פיוט בדברי הראשונים · Piyut in the Rishonim</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Frank+Ruhl+Libre:wght@400;500;700&display=swap">
<style>
/* Same type and color as Rashi/Rashi.html and apps/maharils_moon.html: cool grey ground, white cards, indigo accent.
   Right column: the Rishonim, as cards. Left column: the machzor page, sticky. */
:root{
  --bg:#eef0f4; --panel:#fbfbfd; --ink:#11151f; --ink-2:#4a5163; --ink-3:#7a8194; --rule:#d9dde6; --grid:#e6e9ef;
  --accent:#3b4fa8; --chip:#e3e7f0; --sun:#eb6834; --on-accent:#fbfbfd; --home:#5a1421;
  --display:"Newsreader", Georgia, "Times New Roman", serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --heb:"Frank Ruhl Libre", "David", "Times New Roman", serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--heb);font-size:17px;line-height:1.6;direction:rtl}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* title */
.shaar{max-width:1240px;margin:0 auto;padding:28px 16px 0;text-align:right}
.rule-top,.rule-bottom{display:none}
.shaar h1{font-weight:500;font-size:clamp(30px,5vw,44px);margin:0;line-height:1.1;letter-spacing:-.01em}
.shaar .lede{font-size:17px;color:var(--ink-2);max-width:60ch;margin:8px 0 0}

/* order and filter rows */
.opts{max-width:1240px;margin:0 auto;padding:14px 16px 0;font-size:15px;line-height:1.5;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.opts br{display:none}
.opts .lbl{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding-inline-end:4px}
.opts .dot{display:none}
.opt{border:1px solid var(--rule);border-radius:7px;background:var(--panel);color:var(--ink-2);padding:5px 11px;cursor:pointer;font-size:15px;line-height:1.3}
.opt:hover{border-color:var(--accent);color:var(--ink)}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);cursor:default}
#secOpts{display:contents}

/* two columns */
.open{max-width:1240px;margin:0 auto;padding:14px 16px 50px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:22px;align-items:start}
@media (max-width:920px){.open{grid-template-columns:minmax(0,1fr)}}

/* sections */
.seder{margin-top:22px;scroll-margin-top:16px}
.seder-head h2{margin:0;font-weight:500;font-size:24px;color:var(--ink)}
.seder-rule{border:none;border-top:1px solid var(--rule);margin:6px 0 10px}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.jump .dot{display:none}
.jump .opt{font-size:14px;padding:4px 9px;color:var(--ink-2)}

/* entries */
.entry{display:block;background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:14px 16px 12px;margin-bottom:10px;cursor:pointer;text-align:right}
.entry:hover{border-color:var(--ink-3)}
.entry.active{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.entry-line{display:flex;justify-content:space-between;align-items:baseline;gap:4px 14px;flex-wrap:wrap}
.ref{font-weight:700;font-size:19px;color:var(--ink)}
.paytan{font-size:14px;color:var(--ink-3)}
.pline{font-size:21px;font-weight:500;line-height:1.65;margin:8px 0 4px;padding-inline-start:12px;border-inline-start:3px solid var(--accent)}
.rishon{font-size:16.5px;line-height:1.75;margin:6px 0 0;color:var(--ink-2)}
.rishon b{font-weight:700;color:var(--ink)}
.foot-line{margin-top:8px;font-size:14px;color:var(--ink-3)}
.foot-line .where{color:var(--ink)}
.more{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:14px}
.more:hover{text-decoration:underline}

/* the machzor page */
aside.page{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:18px 20px 16px}
@media (max-width:920px){aside.page{position:static;max-height:none}}
.page h3{margin:0;font-weight:500;font-size:22px;color:var(--ink);line-height:1.3}
.page .sub{font-size:13px;color:var(--ink-3);margin-top:2px;font-family:var(--body)}
.page .cite{margin-top:14px;font-size:14px;color:var(--ink-3)}
.page .note{margin:12px 0 0;font-size:14px;color:var(--ink-2);background:var(--chip);border-radius:8px;padding:8px 12px}
.piyut{margin-top:14px;display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-inline-start:3px solid var(--accent);background:var(--bg);border-radius:0 8px 8px 0}
.piyut p{margin:0;font-size:19px;line-height:1.85;color:var(--ink-2)}
.piyut p.hit{color:var(--ink)}
.piyut mark{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--ink);font-weight:700;border-radius:3px;padding:0 2px}
.piyut .head{font-size:14px;color:var(--ink-3)}
.piyut small{font-size:.85em;color:var(--ink-3)}
.page .toggle{display:block;margin:14px 0 0;background:var(--panel);border:1px solid var(--rule);border-radius:7px;padding:5px 11px;color:var(--accent);cursor:pointer;font-size:14px}
.page .toggle:hover{border-color:var(--accent)}
.page .absent{margin-top:14px;color:var(--ink-2);font-size:15px}
.page .absent .q{display:block;margin-top:10px;font-size:21px;color:var(--ink);font-weight:500}
.page .empty{color:var(--ink-3)}

footer{max-width:1240px;margin:0 auto;padding:0 16px 60px}
footer .rule{border:none;border-top:1px solid var(--rule);margin:0 0 14px}
footer p{font-size:14px;color:var(--ink-3);margin:0 0 6px;max-width:80ch}
@media (max-width:560px){.ref{font-size:17px}.pline{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="shaar">
  <div class="rule-top"></div>
  <h1>פיוט בדברי הראשונים</h1>
  <p class="lede">המקומות שרש״י ובעלי התוספות מביאים בהם לשון הפייטנים, והפיוט כפי שהוא במחזור</p>
  <div class="rule-bottom"></div>
</header>

<div class="opts">
  <span class="lbl">סדר:</span>
  <button type="button" class="opt" id="ord-cal" data-ord="cal" aria-pressed="true">לפי סדר השנה</button><span class="dot">·</span><button type="button" class="opt" id="ord-book" data-ord="book" aria-pressed="false">לפי הספרים</button>
  <br>
  <span id="secOpts"></span>
  <br>
  <button type="button" class="opt" id="st-all" data-st="all" aria-pressed="true">הכל</button><span class="dot">·</span><button type="button" class="opt" id="st-has" data-st="has" aria-pressed="false">שנמצא נוסח הפיוט</button><span class="dot">·</span><button type="button" class="opt" id="st-gap" data-st="gap" aria-pressed="false">שלא נמצא</button>
</div>

<div class="open">
  <main id="sections"></main>
  <aside class="page" id="rail" aria-live="polite"></aside>
</div>

<footer id="foot"></footer>

<script src="piyut-rishonim-data.js"></script>
<script src="piyut-rishonim.js"></script>
<script defer src="../site-chrome.js"></script>
</body>
</html>
