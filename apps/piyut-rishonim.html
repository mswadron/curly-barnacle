<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>פיוט בדברי הראשונים · Piyut in the Rishonim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
/* Layout: a shaar-blatt title page, then two facing columns like an open sefer:
   the Rishonim as a table of contents on the right, the machzor page on the left. */
:root{
  --paper:#f7f2e9; --paper-deep:#f1eadd; --ink:#241d15; --ink-soft:#5c5344;
  --maroon:#5a1421; --maroon-deep:#3d0d18; --rule:#c9bfae; --rule-soft:#ddd5c6;
  --hebrew:'Frank Ruhl Libre','David',serif;
  --body:'Crimson Pro',Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--hebrew);font-size:18px;line-height:1.6;direction:rtl}
a{color:var(--maroon)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--maroon);outline-offset:2px}

/* title page */
.shaar{max-width:820px;margin:0 auto;padding:44px 20px 4px;text-align:center}
.rule-top{border-top:1px solid var(--ink);border-bottom:3px double var(--ink);height:6px;margin-bottom:28px}
.rule-bottom{border-top:3px double var(--ink);border-bottom:1px solid var(--ink);height:6px;margin-top:26px}
.shaar h1{font-weight:900;font-size:50px;margin:0;line-height:1.15;color:var(--maroon-deep)}
.shaar .lede{font-size:19px;color:var(--ink-soft);max-width:44ch;margin:12px auto 0;text-wrap:balance}

/* order and filter lines */
.opts{max-width:1240px;margin:0 auto;padding:14px 20px 0;text-align:center;font-size:17px;line-height:2}
.opt{background:none;border:0;padding:0 2px;cursor:pointer;color:var(--maroon);text-decoration:none}
.opt:hover{text-decoration:underline}
.opt[aria-pressed="true"]{color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px;cursor:default}
.opts .dot{color:var(--rule);padding:0 6px}
.opts .lbl{color:var(--ink-soft)}

/* the two columns */
.open{max-width:1240px;margin:0 auto;padding:6px 20px 50px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,460px);gap:36px;align-items:start}
@media (max-width:920px){.open{grid-template-columns:minmax(0,1fr)}}

/* sections */
.seder{margin-top:30px;scroll-margin-top:16px}
.seder-head{text-align:center}
.seder-head h2{margin:0;font-weight:700;font-size:26px;color:var(--maroon)}
.seder-rule{border:none;border-top:1px solid var(--rule);margin:8px 0 0}
.jump{text-align:center;font-size:16px;line-height:2;margin-top:18px;color:var(--rule)}
.jump .opt{font-size:16px}

/* entries */
.entry{display:block;padding:16px 10px 14px;border-bottom:1px solid var(--rule-soft);cursor:pointer;text-align:right}
.entry:hover{background:var(--paper-deep)}
.entry.active{background:var(--paper-deep);box-shadow:inset -3px 0 0 var(--maroon)}
.entry-line{display:flex;justify-content:space-between;align-items:baseline;gap:4px 14px;flex-wrap:wrap}
.ref{font-weight:700;font-size:20px;color:var(--maroon-deep)}
.paytan{font-size:15.5px;color:var(--ink-soft)}
.pline{font-size:21px;font-weight:500;line-height:1.65;margin:8px 0 4px;padding-inline-start:14px;border-inline-start:1px solid var(--rule)}
.rishon{font-size:17px;line-height:1.75;margin:6px 0 0;color:var(--ink)}
.rishon b{font-weight:700;color:var(--maroon-deep)}
.foot-line{margin-top:6px;font-size:15.5px;color:var(--ink-soft)}
.foot-line .where{color:var(--ink)}
.more{background:none;border:0;padding:0;color:var(--maroon);cursor:pointer;font-size:15.5px}
.more:hover{text-decoration:underline}

/* the machzor page */
aside.page{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;background:var(--paper);border:1px solid var(--rule);padding:22px 22px 18px}
@media (max-width:920px){aside.page{position:static;max-height:none}}
.page .rule-top{margin-bottom:16px}
.page h3{margin:0;text-align:center;font-weight:700;font-size:24px;color:var(--maroon-deep);line-height:1.3}
.page .sub{text-align:center;font-size:15.5px;color:var(--ink-soft);margin-top:2px}
.page .cite{margin-top:14px;font-size:16px;color:var(--ink-soft);text-align:center}
.page .note{margin:12px 0 0;font-size:15.5px;color:var(--ink-soft)}
.piyut{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.piyut p{margin:0;font-size:19px;line-height:1.85}
.piyut p.hit{color:var(--ink)}
.piyut mark{background:none;color:var(--maroon-deep);font-weight:700;text-decoration:underline;text-decoration-color:var(--maroon);text-underline-offset:6px;text-decoration-thickness:1px}
.piyut .head{font-size:15.5px;color:var(--ink-soft)}
.piyut small{font-size:.85em;color:var(--ink-soft)}
.page .toggle{display:block;margin:16px auto 0;background:none;border:0;color:var(--maroon);cursor:pointer;font-size:16px}
.page .toggle:hover{text-decoration:underline}
.page .absent{margin-top:16px;text-align:center;color:var(--ink-soft);font-size:16px}
.page .absent .q{display:block;margin-top:10px;font-size:21px;color:var(--ink);font-weight:500}
.page .empty{color:var(--ink-soft);text-align:center}

footer{max-width:820px;margin:0 auto;padding:0 20px 60px;text-align:center}
footer .rule{border:none;border-top:1px solid var(--rule);margin:0 0 14px}
footer p{font-size:15.5px;color:var(--ink-soft);margin:0 0 6px}
@media (max-width:560px){.shaar h1{font-size:36px}.ref{font-size:18px}.pline{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="shaar">
  <div class="rule-top"></div>
  <h1>פיוט בדברי הראשונים</h1>
  <p class="lede">המקומות שרש״י ובעלי התוספות מביאים בהם לשון הפייטנים, והפיוט כפי שהוא במחזור</p>
  <div class="rule-bottom"></div>
</header>

<div class="opts">
  <span class="lbl">סדר:</span>
  <button type="button" class="opt" id="ord-cal" data-ord="cal" aria-pressed="true">לפי סדר השנה</button><span class="dot">·</span><button type="button" class="opt" id="ord-book" data-ord="book" aria-pressed="false">לפי הספרים</button>
  <br>
  <span id="secOpts"></span>
  <br>
  <button type="button" class="opt" id="st-all" data-st="all" aria-pressed="true">הכל</button><span class="dot">·</span><button type="button" class="opt" id="st-has" data-st="has" aria-pressed="false">שנמצא נוסח הפיוט</button><span class="dot">·</span><button type="button" class="opt" id="st-gap" data-st="gap" aria-pressed="false">שלא נמצא</button>
</div>

<div class="open">
  <main id="sections"></main>
  <aside class="page" id="rail" aria-live="polite"></aside>
</div>

<footer id="foot"></footer>

<script src="piyut-rishonim-data.js"></script>
<script src="piyut-rishonim.js"></script>
<script defer src="../site-chrome.js"></script>
</body>
</html>
