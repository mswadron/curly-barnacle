<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://www.sefaria.org">
<title>משנה כתורה שבעל פה · מסכת ביצה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --page:#e6ecf0; --card:#ffffff; --card-soft:#f4f7f9; --rule:#d5dde3;
  --ink:#1c2a35; --mute:#5d6d79; --teal:#0e6e6a; --teal-deep:#0a4f4c; --teal-tint:#e3f1f0;
  --warn:#9a5b12; --warn-tint:#fbf1e3;
  --he-title:'Secular One',sans-serif; --he:'IBM Plex Sans Hebrew',sans-serif; --en:'Fredoka',sans-serif;
  --t1:#0e6e6a; --t2:#2f5d8a; --t3:#7a4e9a; --t4:#9a5b12; --t5:#a2394f;
  --t6:#3d7a32; --t7:#5b6470; --t8:#8a6b1f; --t9:#1f6f8b; --t10:#6b4b3a; --t11:#2d6a86;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink)}
body{font-family:var(--he);font-size:16px;line-height:1.6}
a{color:var(--teal)}
.he{font-family:var(--he);direction:rtl;text-align:right}
.en{font-family:var(--en);direction:ltr;text-align:left}

.top{position:sticky;top:0;z-index:5;background:var(--page);border-bottom:1px solid var(--rule)}
.top-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;direction:rtl}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.logo{width:30px;height:30px;border-radius:7px;background:var(--teal);color:#fff;display:grid;place-items:center;font-family:var(--he-title);font-size:15px;line-height:1}
.brand-name{font-family:var(--en);font-weight:600;font-size:17px}
.spacer{flex:1}
.lang{display:flex;border:1px solid var(--teal);border-radius:6px;overflow:hidden;direction:ltr}
.lang button{border:0;background:transparent;color:var(--teal);font:600 12px var(--en);padding:5px 10px;cursor:pointer}
.lang button.on{background:var(--teal);color:#fff}

main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
h1{font-family:var(--he-title);font-weight:400;color:var(--teal-deep);font-size:clamp(26px,6vw,36px);line-height:1.2;margin:0;direction:rtl;text-align:right}
#masechta{font-family:var(--he-title);color:var(--teal);font-size:clamp(19px,4.5vw,24px);direction:rtl;text-align:right;margin-top:2px}
#subtitle{font-family:var(--en);color:var(--mute);font-size:15px;direction:ltr;text-align:left}
#subtitle:empty{display:none}
#intro{margin:10px 0 22px;color:var(--ink);max-width:760px}
#intro p{margin:0}
#intro p.en{font-family:var(--en)}

.eyebrow{display:block;font-family:var(--he);font-weight:700;font-size:12px;letter-spacing:.04em;color:var(--teal);margin-bottom:4px}
.eyebrow a{font-weight:500;color:var(--mute);text-decoration:none;font-family:var(--en)}
.eyebrow .ed{font-style:normal;font-weight:500;color:var(--warn);background:var(--warn-tint);border-radius:4px;padding:0 6px;margin-inline-start:8px;font-size:11px}

.legend-wrap{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:14px 14px 10px;margin-bottom:22px;direction:rtl}
.legend-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.legend-head h3{font-family:var(--he-title);font-weight:400;color:var(--teal-deep);font-size:20px;margin:0}
#legend-hint{color:var(--mute);font-size:13px}
#clear{margin-inline-start:auto;border:1px solid var(--teal);background:#fff;color:var(--teal);border-radius:6px;font:600 12px var(--he);padding:3px 10px;cursor:pointer}
#legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:6px;margin-top:10px}
.legend-item{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--card-soft);border-radius:8px;padding:6px 8px;cursor:pointer;text-align:right;font:inherit;color:inherit;direction:rtl}
.legend-item:hover{border-color:var(--teal)}
.legend-item.on{border-color:var(--teal);background:var(--teal-tint);outline:2px solid var(--teal);outline-offset:-2px}
.ldesc{flex:1;font-size:13px;color:var(--mute);line-height:1.35}
.lcount{font:600 12px var(--en);color:var(--mute);min-width:18px;text-align:center}

.tag{display:inline-flex;align-items:center;gap:5px;border-radius:5px;padding:2px 8px 2px 6px;color:#fff;font:600 13px var(--he);white-space:nowrap}
.tag b{font:600 11px var(--en);background:rgba(255,255,255,.22);border-radius:3px;padding:0 4px}
.tag.sm{font-size:12px;padding:1px 7px 1px 5px}
.t1{background:var(--t1)}.t2{background:var(--t2)}.t3{background:var(--t3)}.t4{background:var(--t4)}.t5{background:var(--t5)}
.t6{background:var(--t6)}.t7{background:var(--t7)}.t8{background:var(--t8)}.t9{background:var(--t9)}.t10{background:var(--t10)}.t11{background:var(--t11)}

#cards{display:flex;flex-direction:column;gap:18px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;overflow:hidden;direction:rtl}
.card.is-pending{opacity:.92}
.card-head{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--rule);background:var(--card-soft)}
.num{font:600 15px var(--en);color:#fff;background:var(--teal);border-radius:6px;padding:3px 9px;direction:ltr}
.names{flex:1;min-width:0}
.names h2{font-family:var(--he-title);font-weight:400;font-size:22px;color:var(--teal-deep);margin:0;line-height:1.25}
.en-name{font-family:var(--en);color:var(--mute);font-size:14px;direction:ltr;text-align:right}
.count{text-align:center;line-height:1.1}
.count b{display:block;font:600 20px var(--en);color:var(--teal)}
.count span{font-size:11px;color:var(--mute)}

.mishnah,.gap,.moves,.halacha,.simen{padding:12px 14px;border-bottom:1px solid var(--rule)}
.mtext{font-size:19px;line-height:1.85;margin:0;font-weight:500}
.gap{background:var(--teal-tint)}
.gap p{margin:0}
.gap p.en{font-family:var(--en);font-size:15px}
.gap p.sub{font-size:14px;color:var(--mute);margin-top:6px}
.move{border-inline-start:3px solid var(--teal);padding:8px 12px;margin:8px 0;background:var(--card-soft);border-radius:0 6px 6px 0;transition:opacity .15s}
.move.dim{opacity:.32}
.move-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.who{font-weight:700;font-size:14px}
.daf{font:500 13px var(--he);color:var(--mute);text-decoration:none;border-bottom:1px dotted var(--mute)}
.move-head .daf{margin-inline-start:auto}
.quote{margin:6px 0 0;font-size:17.5px;line-height:1.8}
.mk-topic{font-weight:700;font-size:14px;color:var(--ink)}
.mk-side{border-top:1px dashed var(--rule);margin-top:8px;padding-top:6px}
.mk-side:first-of-type{border-top:0}
.mk-who{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.mk-who span{font-weight:700;font-size:15px;color:var(--teal-deep)}
.mk-who .daf{margin-inline-start:auto}
.mk-side .quote{margin-top:2px}
.st{display:inline-flex;flex-wrap:wrap;align-items:center;gap:3px 5px;border-radius:5px;padding:2px 7px;font-size:12px;font-weight:600;line-height:1.4}
.st .sep{opacity:.5}
.st a{color:inherit;text-decoration:none;border-bottom:1px dotted currentColor}
.st-nidcheh{background:#e9ecef;color:#4a5560}
.st-halacha{background:var(--teal-tint);color:var(--teal-deep)}
.st-hover{margin:4px 0 0;font-size:13.5px;color:var(--mute);line-height:1.6}
.st-hover b{font-weight:600;color:var(--ink)}
.prs{border:1px solid var(--teal);background:#fff;color:var(--teal);border-radius:5px;font:600 12px var(--he);padding:1px 8px;cursor:pointer;margin-inline-start:6px}
.prs.on{background:var(--teal);color:#fff}
.prs-panel{margin:8px 0 2px;padding:8px 12px;border:1px solid var(--rule);border-radius:6px;background:#fff;font-size:15.5px;line-height:1.75;color:var(--ink-2,#2a3a4c)}
.prs-panel p{margin:0 0 6px}
.prs-panel b{font-weight:700;color:var(--ink)}
.prs-panel small{color:var(--mute);font-size:.9em}
.prs-src{font-size:12px;color:var(--mute);margin-bottom:6px}
.prs-src a{color:var(--teal);text-decoration:none}
.prs-wait{color:var(--mute);font-size:13px}
.mk-frame{color:var(--mute);font-size:16px}
.halacha{background:#f1f6ee}
.halacha .eyebrow{color:var(--t6)}
.pending{background:var(--warn-tint);color:var(--warn);border-radius:6px;padding:10px 12px;font-size:14px}
.simen{display:flex;align-items:center;gap:10px;border-bottom:0}
.simen .eyebrow{margin:0}
.simen .blank{flex:1;border:1px dashed var(--rule);border-radius:6px;padding:4px 10px;color:var(--mute);font-size:13px}

#pereknav{position:sticky;top:51px;z-index:4;display:flex;gap:0;overflow-x:auto;background:var(--page);padding:8px 0;margin:-6px 0 14px;direction:rtl;scrollbar-width:none}
#pereknav button{flex:0 0 auto;border:1px solid var(--teal);margin-inline-start:-1px;background:#fff;color:var(--teal);font:600 13px var(--he);padding:6px 12px;cursor:pointer;white-space:nowrap}
#pereknav button:first-child{border-radius:0 6px 6px 0}
#pereknav button:last-child{border-radius:6px 0 0 6px}
#pereknav button.on{background:var(--teal);color:#fff}
.perek-head{font-family:var(--he-title);font-weight:400;color:var(--teal-deep);font-size:24px;margin:10px 0 -4px;direction:rtl;text-align:right;border-bottom:2px solid var(--teal);padding-bottom:4px}
.perek-head .pl{font-size:15px;color:var(--teal);font-family:var(--he);font-weight:700;margin-inline-end:6px}
.perek-head .pen{font-family:var(--en);font-size:15px;color:var(--mute)}
.empty{color:var(--mute);direction:rtl}
footer{max-width:980px;margin:0 auto;padding:0 16px 40px;color:var(--mute);font-size:13px;direction:rtl}

@media (max-width:560px){
  .mtext{font-size:18px}
  .quote{font-size:16.5px}
  .card-head{padding:10px 12px}
  .mishnah,.gap,.moves,.halacha,.simen{padding:10px 12px}
}
</style>
<link rel="stylesheet" href="../skin.css">
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="../index.html"><span class="logo">Lל</span><span class="brand-name">limudlab</span></a>
  <span class="spacer"></span>
  <div class="lang"><button data-lang="he">HE</button><button data-lang="en">EN</button></div>
</div></header>

<main>
  <h1 id="title"></h1>
  <div id="masechta"></div>
  <div id="subtitle"></div>
  <div id="intro"></div>

  <section class="legend-wrap">
    <div class="legend-head"><h3 id="legend-title"></h3><span id="legend-hint"></span><button id="clear" hidden></button></div>
    <div id="legend"></div>
  </section>

  <nav id="pereknav"></nav>
  <section id="cards"></section>
</main>

<footer>

</footer>

<script src="beitza.js?v=20261012f"></script>

</body>
</html>
