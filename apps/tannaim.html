<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>חכמי המשנה · The Sages of the Mishnah</title>
<link rel="preconnect" href="https://www.sefaria.org">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --page:#e6ecf0; --card:#ffffff; --card-soft:#f4f7f9; --rule:#d5dde3; --rule-2:#c3cdd8;
  --ink:#1c2a35; --mute:#5d6d79; --mute-2:#8593a0; --teal:#0e6e6a; --teal-deep:#0a4f4c; --teal-tint:#e3f1f0;
  --warn:#9a5b12; --warn-tint:#fbf1e3;
  --he-title:'Secular One',sans-serif; --he:'IBM Plex Sans Hebrew',sans-serif; --en:'Fredoka',sans-serif;
  --src:'Frank Ruhl Libre','IBM Plex Sans Hebrew',serif;
  /* kinds of mention */
  --k-dispute:#0e6e6a; --k-testimony:#2f5d8a; --k-story:#7a4e9a; --k-saying:#9a5b12; --k-ruling:#8593a0;
  --rail:380px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink)}
body{font-family:var(--he);font-size:16px;line-height:1.55}
a{color:var(--teal)}
button{font:inherit;color:inherit}
.he{font-family:var(--he);direction:rtl;text-align:right}
.en{font-family:var(--en);direction:ltr;text-align:left}
[hidden]{display:none!important}

/* ---- top bar ---- */
.top{position:sticky;top:0;z-index:20;background:var(--page);border-bottom:1px solid var(--rule)}
.top-in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;direction:rtl}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.logo{width:30px;height:30px;border-radius:7px;background:var(--teal);color:#fff;display:grid;place-items:center;font-family:var(--he-title);font-size:15px;line-height:1}
.brand-name{font-family:var(--en);font-weight:600;font-size:17px}
.spacer{flex:1}
.lang{display:flex;border:1px solid var(--teal);border-radius:6px;overflow:hidden;direction:ltr}
.lang button{border:0;background:transparent;color:var(--teal);font:600 12px var(--en);padding:5px 10px;cursor:pointer}
.lang button.on{background:var(--teal);color:#fff}

/* ---- page ---- */
.wrap{max-width:1280px;margin:0 auto;padding:18px 16px 70px;display:grid;grid-template-columns:minmax(0,1fr) var(--rail);gap:20px;direction:rtl;align-items:start}
main{min-width:0}
h1{font-family:var(--he-title);font-weight:400;color:var(--teal-deep);font-size:clamp(26px,6vw,36px);line-height:1.2;margin:0}
#subtitle{color:var(--mute);font-size:15px;margin:2px 0 0}
#intro{margin:10px 0 16px;max-width:820px;font-size:15.5px}
#intro p{margin:0 0 6px}

.freeze{position:sticky;top:var(--hdr,51px);z-index:15;background:var(--page);padding:8px 0 6px;margin-bottom:6px;box-shadow:0 1px 0 var(--rule)}
.freeze:before{content:"";position:absolute;inset:-20px 0 100% 0;background:var(--page)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
#legend{margin:8px 0 2px}
#legend:empty{display:none}
.seg{display:flex;direction:rtl;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.seg button{flex:0 0 auto;border:1px solid var(--teal);margin-inline-start:-1px;background:#fff;color:var(--teal);font:600 13.5px var(--he);padding:6px 13px;cursor:pointer;white-space:nowrap}
.seg button:first-child{border-radius:0 7px 7px 0;margin-inline-start:0}
.seg button:last-child{border-radius:7px 0 0 7px}
.seg button.on{background:var(--teal);color:#fff}
.seg.sm button{font-size:12.5px;padding:4px 10px}
.search{flex:1 1 200px;min-width:160px;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--rule-2);border-radius:7px;padding:0 10px}
.search input{flex:1;border:0;outline:0;background:transparent;font:500 14.5px var(--he);padding:7px 0;direction:rtl;min-width:0}
.search .x{border:0;background:none;color:var(--mute);cursor:pointer;font-size:16px;padding:0 2px}
.search-results{position:absolute;z-index:30;background:#fff;border:1px solid var(--rule-2);border-radius:8px;box-shadow:0 8px 24px rgba(20,32,46,.12);max-height:320px;overflow:auto;min-width:240px;padding:4px}
.search-results button{display:flex;width:100%;gap:8px;align-items:baseline;border:0;background:none;padding:7px 9px;border-radius:6px;cursor:pointer;text-align:right;direction:rtl}
.search-results button:hover,.search-results button.act{background:var(--teal-tint)}
.search-results .sr-en{font-family:var(--en);color:var(--mute);font-size:12.5px;margin-inline-start:auto;direction:ltr}

.eyebrow{display:block;font-weight:700;font-size:12px;color:var(--teal);margin-bottom:4px}
.note{color:var(--mute);font-size:13px}
.gapnote{background:var(--warn-tint);color:var(--warn);border-radius:7px;padding:7px 10px;font-size:13px;margin:8px 0}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:14px;margin-bottom:16px}
.panel h2{font-family:var(--he-title);font-weight:400;color:var(--teal-deep);font-size:21px;margin:0 0 4px}
.panel h3{font-family:var(--he-title);font-weight:400;color:var(--teal-deep);font-size:17px;margin:12px 0 6px}

/* ---- kind legend + bars ---- */
.kinds{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--mute);margin:4px 0 12px}
.kinds span{display:inline-flex;align-items:center;gap:5px}
.kinds i{display:inline-block;width:11px;height:11px;border-radius:3px}
.k-dispute{background:var(--k-dispute)} .k-testimony{background:var(--k-testimony)} .k-story{background:var(--k-story)} .k-saying{background:var(--k-saying)} .k-ruling{background:var(--k-ruling)}
.kbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--rule);direction:rtl}
.kbar i{display:block;height:100%}
.kchip{display:inline-block;border-radius:4px;color:#fff;font-size:11.5px;font-weight:600;padding:0 6px;line-height:1.6;white-space:nowrap}

/* ---- generations view ---- */
.band{background:var(--card);border:1px solid var(--rule);border-radius:10px;margin-bottom:12px;overflow:hidden}
.band-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:9px 14px;background:var(--card-soft);border-bottom:1px solid var(--rule)}
.band-head h2{font-family:var(--he-title);font-weight:400;color:var(--teal-deep);font-size:19px;margin:0}
.band-head .bn{font-family:var(--en);font-size:13px;color:var(--mute)}
.band-head .bc{margin-inline-start:auto;font-size:12.5px;color:var(--mute)}
.band-body{display:flex;flex-wrap:wrap;gap:7px;padding:11px 12px 12px}
.sage{display:flex;flex-direction:column;gap:4px;border:1px solid var(--rule);background:#fff;border-radius:8px;padding:6px 9px 7px;cursor:pointer;text-align:right;direction:rtl;min-width:104px;max-width:220px;flex:0 1 auto}
.sage:hover{border-color:var(--teal);background:#fbfdfd}
.sage.on{outline:2px solid var(--teal);outline-offset:-2px;background:var(--teal-tint)}
.sage.dim{opacity:.35}
.sage .sn{font-weight:600;font-size:15px;line-height:1.3}
.sage .se{font-family:var(--en);font-size:11.5px;color:var(--mute);direction:ltr;text-align:right;line-height:1.2}
.sage .sm{display:flex;align-items:center;gap:6px;font:600 11px var(--en);color:var(--mute)}
.sage .sm .kbar{flex:1;min-width:40px}
.sage.big .sn{font-size:17px}
.sage.voice{background:var(--card-soft);border-style:dashed}
.tag-nasi{font-size:10.5px;font-weight:700;color:var(--teal-deep);background:var(--teal-tint);border-radius:4px;padding:0 5px;margin-inline-start:4px;vertical-align:1px}

/* ---- chains ---- */
.chain{display:flex;flex-direction:column;align-items:stretch;gap:0}
.link{display:grid;grid-template-columns:1fr;gap:4px;border-inline-start:3px solid var(--teal);margin-inline-start:12px;padding:8px 14px 10px;position:relative}
.link:before{content:"";position:absolute;inset-inline-start:-8px;top:15px;width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid var(--teal)}
.link .who{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.link .src{font-family:var(--src);font-size:17px;line-height:1.75;color:var(--ink)}
.link .ref{font-size:12.5px;color:var(--mute);text-decoration:none;border-bottom:1px dotted var(--mute)}
.link.end{border-inline-start-color:transparent}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--teal);background:#fff;color:var(--teal-deep);border-radius:999px;padding:2px 10px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.pill:hover{background:var(--teal-tint)}
.pill.off{border-color:var(--rule-2);color:var(--mute);cursor:default;background:var(--card-soft)}
.pill .g{font:600 10.5px var(--en);color:var(--mute)}
.ego{display:flex;flex-direction:column;align-items:center;gap:6px}
.ego-row{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:100%}
.ego-lbl{font-size:12px;font-weight:700;color:var(--teal);margin-top:6px}
.ego-mid{display:flex;flex-direction:column;align-items:center;border:2px solid var(--teal);background:var(--teal-tint);border-radius:12px;padding:8px 18px;margin:4px 0}
.ego-mid b{font-family:var(--he-title);font-weight:400;font-size:22px;color:var(--teal-deep)}
.ego-mid span{font-family:var(--en);font-size:13px;color:var(--mute)}
.ego-arrow{color:var(--teal);font-size:18px;line-height:1}
.ego-src{font-size:11.5px;color:var(--mute);text-align:center}

/* ---- work a mishnah ---- */
.picker{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.picker select{font:500 14.5px var(--he);border:1px solid var(--rule-2);border-radius:7px;padding:6px 8px;background:#fff;direction:rtl;max-width:100%}
.picker .nav{border:1px solid var(--teal);background:#fff;color:var(--teal);border-radius:7px;font:600 13px var(--he);padding:5px 11px;cursor:pointer}
.picker .nav:disabled{opacity:.4;cursor:default}
.mtext{font-family:var(--src);font-size:21px;line-height:1.95;margin:12px 0 4px;font-weight:500}
.mtext .nm{all:unset;cursor:pointer;color:var(--teal-deep);font-weight:700;border-bottom:2px solid var(--teal);padding:0 1px;border-radius:2px}
.mtext .nm:hover,.mtext .nm.on{background:var(--teal-tint)}
.mref{font-size:12.5px;color:var(--mute)}
.speakers{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.sp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ruler{position:relative;height:56px;margin:10px 4px 2px;border-top:2px solid var(--rule-2)}
.ruler .tick{position:absolute;top:-7px;width:2px;height:12px;background:var(--rule-2)}
.ruler .tl{position:absolute;top:8px;font:600 11px var(--en);color:var(--mute);transform:translateX(50%)}
.ruler .dot{position:absolute;top:-9px;transform:translateX(50%);display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
.ruler .dot i{width:14px;height:14px;border-radius:50%;background:var(--teal);border:2px solid #fff;box-shadow:0 0 0 1px var(--teal)}
.ruler .dot span{font-size:11.5px;font-weight:600;white-space:nowrap;background:rgba(255,255,255,.9);padding:0 3px;border-radius:3px}
.rel{font-size:14px;line-height:1.55;margin:3px 0;padding:6px 10px;background:var(--card-soft);border-radius:7px;border-inline-start:3px solid var(--teal)}
.rel small{color:var(--mute)}
.lineup{display:flex;flex-direction:column;gap:2px;margin:4px 0 8px}
.lu{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card-soft);border-radius:8px;padding:6px 8px}
.lu .chip{flex:0 0 auto}
.lu-arrow{color:var(--teal);text-align:center;line-height:1;font-size:15px}
.quiz{margin-top:8px}
.quiz .pool,.quiz .ans{display:flex;flex-wrap:wrap;gap:6px;min-height:34px;padding:6px;border:1px dashed var(--rule-2);border-radius:8px;margin:6px 0}
.quiz .ans{background:var(--card-soft)}
.quiz .res{font-weight:600;font-size:14px}
.quiz .res.ok{color:var(--teal-deep)} .quiz .res.no{color:#a2394f}
.btn{border:1px solid var(--teal);background:#fff;color:var(--teal);border-radius:7px;font:600 13px var(--he);padding:5px 12px;cursor:pointer}
.btn.fill{background:var(--teal);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.xlink{display:inline-flex;gap:6px;align-items:center;font-size:14px;font-weight:600;text-decoration:none;border:1px solid var(--teal);border-radius:7px;padding:5px 11px;background:#fff}

/* ---- list view ---- */
table.idx{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--rule);border-radius:10px;overflow:hidden;font-size:14px}
table.idx th{background:var(--card-soft);font-weight:700;font-size:12.5px;color:var(--teal-deep);text-align:right;padding:7px 8px;border-bottom:1px solid var(--rule);cursor:pointer;white-space:nowrap}
table.idx th.on:after{content:" ▾"}
table.idx td{padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:middle}
table.idx tr{cursor:pointer}
table.idx tr:hover td{background:var(--teal-tint)}
table.idx td.num{font:600 13px var(--en);text-align:center;color:var(--ink)}
table.idx td .se{font-family:var(--en);color:var(--mute);font-size:12px;direction:ltr;display:block;text-align:right}
table.idx td.bar{min-width:90px}

/* ---- rail (profile) ---- */
.rail{position:sticky;top:64px;max-height:calc(100vh - 78px);overflow:auto;background:var(--card);border:1px solid var(--rule);border-radius:10px;scrollbar-width:thin}
.rail-empty{padding:18px;color:var(--mute);font-size:14.5px}
.rail-head{padding:14px 16px 10px;border-bottom:1px solid var(--rule);background:var(--card-soft);position:sticky;top:0;z-index:1}
.rail-head h2{font-family:var(--he-title);font-weight:400;font-size:25px;color:var(--teal-deep);margin:0;line-height:1.2}
.rail-head .en-name{font-family:var(--en);color:var(--mute);font-size:14px;direction:ltr;text-align:right}
.rail-head .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:5px;padding:1px 7px;background:var(--teal-tint);color:var(--teal-deep)}
.chip.grey{background:#eceff2;color:var(--mute)}
.chip.warn{background:var(--warn-tint);color:var(--warn)}
.chip .s{font:500 10.5px var(--en);opacity:.8}
.close{position:absolute;top:10px;inset-inline-end:10px;border:0;background:none;font-size:22px;line-height:1;color:var(--mute);cursor:pointer;display:none}
.rs{padding:12px 16px;border-bottom:1px solid var(--rule)}
.rs:last-child{border-bottom:0}
.rs .eyebrow{margin-bottom:6px}
.bio{font-size:14.5px;line-height:1.65;margin:0}
.bio.en{font-family:var(--en);font-size:14px}
.srcline{font-size:11.5px;color:var(--mute);margin-top:5px}
.srcline a{color:var(--mute)}
.stat{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.stat div{line-height:1.15}
.stat b{display:block;font:600 22px var(--en);color:var(--teal)}
.stat span{font-size:11.5px;color:var(--mute)}
.krow{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:13px;margin-top:4px}
.krow .kb{height:8px;border-radius:3px}
.krow .kn{font:600 12px var(--en);color:var(--mute);min-width:22px;text-align:left}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.mlist{display:flex;flex-direction:column;gap:2px}
.mt{border:1px solid var(--rule);border-radius:7px;overflow:hidden}
.mt + .mt{margin-top:4px}
.mt summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:8px;padding:6px 10px;background:var(--card-soft);font-weight:600;font-size:14px}
.mt summary::-webkit-details-marker{display:none}
.mt summary .c{font:600 12px var(--en);color:var(--mute)}
.mt .items{display:flex;flex-wrap:wrap;gap:5px;padding:7px 9px}
.mi{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--rule-2);border-radius:6px;background:#fff;padding:1px 6px 1px 4px;font:600 12.5px var(--en);cursor:pointer;direction:ltr}
.mi i{width:8px;height:8px;border-radius:2px;display:inline-block}
.mi:hover{border-color:var(--teal)}
.mi.def{border-style:dashed}
.ident{font-size:12.5px;color:var(--mute);margin-top:6px}
.outl{display:flex;flex-wrap:wrap;gap:8px;font-size:13px}
.yr{display:grid;grid-template-columns:92px 1fr;gap:8px;font-size:14px;padding:3px 0;align-items:baseline}
.yl{color:var(--mute);font-size:12.5px;font-weight:700}
.ys{display:block;font:500 11px var(--en);color:var(--mute-2);direction:ltr;text-align:right}
.am{color:var(--mute);font-size:12.5px}
.plc{all:unset;cursor:pointer;color:var(--teal-deep);font-weight:600;border-bottom:1px dotted var(--teal)}
.band-head .by{font-size:12.5px;color:var(--ink)}
/* map */
.maphead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:8px}
.maphead h2{margin:0}
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(200px,0.8fr);gap:12px;align-items:start}
.mapbox{display:flex;justify-content:center}
.mappanel.big .mapbox{max-height:none}
svg.bm{display:block;height:520px;width:auto;max-width:100%;overflow:hidden;border:1px solid var(--rule);border-radius:8px}
.mappanel.big svg.bm{height:min(78vh,760px)}
svg.bm text{font-family:var(--he);fill:#1c2a35;paint-order:stroke;stroke:#f6f3ec;stroke-width:3px;stroke-linejoin:round;pointer-events:none;direction:rtl}
svg.bm text.geo{fill:#5b7f93;font-style:italic;stroke:none}
svg.bm .mp{cursor:pointer}
svg.bm .mp:hover circle,svg.bm .mp:focus circle{stroke:#1c2a35}
.placebox{min-height:60px}
.outside{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.pill.sel{background:#fde7d9;border-color:#c2410c}
.cw{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:11.5px;color:var(--mute);line-height:1.3}
.cw-p{display:inline-flex;align-items:center;gap:3px;color:var(--teal-deep)}
.cw-y{font-family:var(--en);unicode-bidi:isolate}
@media (max-width:700px){.mapgrid{grid-template-columns:1fr}svg.bm{height:auto;width:100%;max-height:none}.mappanel.big svg.bm{height:auto}}

footer{max-width:1280px;margin:0 auto;padding:0 16px 40px;color:var(--mute);font-size:13px;direction:rtl}
footer p{margin:0 0 6px}

/* ---- phone: the rail becomes a sheet ---- */
@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset-inline:0;bottom:0;top:auto;max-height:78vh;border-radius:14px 14px 0 0;z-index:9150;box-shadow:0 -10px 30px rgba(20,32,46,.18);transform:translateY(105%);transition:transform .22s ease}
  .rail.open{transform:none}
  .rail .close{display:block}
  .rail-empty{display:none}
  .scrim{position:fixed;inset:0;background:rgba(20,32,46,.25);z-index:9140}
  .mtext{font-size:19px}
}
@media (max-width:560px){
  .sage{min-width:92px}
  table.idx .hide-sm{display:none}
}
</style>
<link rel="stylesheet" href="../skin.css">
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="../index.html"><span class="logo">Lל</span><span class="brand-name">limudlab</span></a>
  <span class="spacer"></span>
  <div class="lang"><button data-lang="he">HE</button><button data-lang="en">EN</button></div>
</div></header>

<div class="wrap">
  <main>
    <h1 id="title"></h1>
    <p id="subtitle"></p>
    <div id="intro"></div>
    <div class="freeze">
      <div class="toolbar">
        <nav class="seg" id="views"></nav>
        <div class="search" id="searchbox"><input id="q" type="search" autocomplete="off"><button class="x" id="qx" hidden>×</button></div>
      </div>
      <div class="kinds" id="legend"></div>
    </div>
    <div id="results" class="search-results" hidden></div>
    <section id="view"></section>
  </main>
  <aside class="rail" id="rail" aria-live="polite"></aside>
</div>
<div class="scrim" id="scrim" hidden></div>

<footer id="foot"></footer>

<script src="tannaim-data.js?v=20261117d"></script>
<script src="tannaim.js?v=20261117d"></script>
<script defer src="../site-chrome.js"></script>
